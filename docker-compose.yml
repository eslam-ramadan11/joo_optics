services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-joo_optics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-joo_optics}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-joo_optics} -d $${POSTGRES_DB:-joo_optics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-joo_optics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-joo_optics}
      RATELIMIT_STORAGE_URL: redis://redis:6379
      PRESCRIPTIONS_UPLOAD_FOLDER: /var/uploads/prescriptions
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - prescriptions_data:/var/uploads/prescriptions
    command: sh -c "flask db upgrade && gunicorn --workers=4 --timeout=120 --bind=0.0.0.0:5000 --access-logfile=- --error-logfile=- wsgi:app"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  postgres_data:
  prescriptions_data:
