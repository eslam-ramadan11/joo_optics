[pytest]
# Pytest configuration for Joo Optics API tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra

# Coverage configuration
testpaths = .
norecursedirs = .git .venv venv env build dist *.egg __pycache__ migrations

# Markers for different test types
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multiple components
    slow: Slow tests that take >1 second
    auth: Authentication and authorization tests
    products: Product endpoint tests
    orders: Order endpoint tests
    prescriptions: Prescription upload tests
    payments: Payment processing tests
    security: Security and access control tests

# Database for testing
# Uses in-memory SQLite for speed
SQLALCHEMY_DATABASE_URI = sqlite:///:memory:

# Disable verbose output by default
log_level = INFO

# Timeout for slow tests (in seconds)
timeout = 300
