<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر - Joo Optics</title>
<meta name="description" content="تصفح تشكيلة Joo Optics الكاملة من النظارات الطبية والشمسية للرجال والحريم والأطفال. اطلب أونلاين في مصر مع اختيار نوع العدسة المناسب.">
<meta name="keywords" content="شراء نظارات اونلاين مصر, نظارات شمس رجالي, نظارات شمس حريمي, نظارات اطفال, شنابر طبي">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Joo Optics">
<meta property="og:title" content="المتجر - Joo Optics">
<meta property="og:description" content="تصفح تشكيلة Joo Optics الكاملة من النظارات الطبية والشمسية للرجال والحريم والأطفال. اطلب أونلاين في مصر مع اختيار نوع العدسة المناسب.">
<meta property="og:locale" content="ar_EG">
<meta property="og:image" content="/images/logo.jpg">
<meta name="geo.region" content="EG">
<meta name="geo.placename" content="Egypt">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
        <div class="announcement-bar">🚚 الشحن مجاني على جميع الطلبات</div>
<header>
    <button class="header-icon-btn nav-toggle-btn" onclick="toggleMobileNav()" aria-label="القائمة">
        <i class="fa-solid fa-bars"></i>
    </button>

    <a href="index.html" style="text-decoration:none;">
        <span class="site-logo"><i class="fa-solid fa-glasses logo-mark"></i> Joo Optics</span>
    </a>

    <nav id="mainNav">
        <a href="index.html">الرئيسية</a>
        <a href="shop.html" class="active">المتجر</a>
        <a href="index.html#lens-calculator-section">العدسات</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
    </nav>

    <div class="header-actions">
        <form class="header-search-form" id="headerSearchForm">
            <input type="text" id="headerSearchInput" placeholder="ابحث عن نظارة...">
        </form>
        <button type="button" class="header-icon-btn" onclick="toggleHeaderSearch()" aria-label="بحث">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
        <button type="button" class="header-icon-btn" onclick="showCart()" aria-label="السلة">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge" id="cart-count">0</span>
        </button>
        <button id="userButton" class="header-icon-btn" onclick="toggleUserMenu()" aria-label="الحساب">
            <span id="userAvatarBubble" class="header-avatar">?</span>
        </button>
    </div>

    <div id="userMenu" class="user-dropdown" style="display: none;">
        <button id="loginMenuBtn" onclick="window.location.href='/login.html'">تسجيل الدخول / إنشاء حساب</button>
        <button id="logoutMenuBtn" onclick="logout()" class="danger" style="display: none;">تسجيل الخروج</button>
        <button id="userInfoBtn" onclick="showUserInfo()" style="display: none;">حسابي</button>
    </div>
</header>

    <section class="section shop-page reveal">
        <h1 class="page-title">متجرنا</h1>

        <form class="shop-toolbar" id="shop-search-form">
            <input type="search" id="shop-search" placeholder="ابحث عن منتج أو قسم" aria-label="ابحث في المتجر">
            <select id="shop-category" aria-label="القسم">
                <option value="">كل الأقسام</option>
            </select>
            <select id="shop-sort" aria-label="الترتيب">
                <option value="id-desc">الأحدث</option>
                <option value="price-asc">السعر: من الأقل للأعلى</option>
                <option value="price-desc">السعر: من الأعلى للأقل</option>
                <option value="name-asc">الاسم: أ إلى ي</option>
                <option value="name-desc">الاسم: ي إلى أ</option>
            </select>
            <button type="submit" class="button">بحث</button>
            <button type="button" class="button" id="shop-reset">إعادة ضبط</button>
        </form>

        <p class="shop-summary" id="shop-summary"></p>

        <div class="products" id="shop-grid">
            <p style="grid-column:1/-1; text-align:center;">جارٍ تحميل المنتجات...</p>
        </div>

        <div class="shop-pagination" id="shop-pagination"></div>
    </section>

    <footer class="ending-page reveal">
        <h2>Joo Optics</h2>
        <p>Luxury Eyewear For Modern Style</p>
    </footer>

    <script src="tracking.js"></script>
    <script src="toast.js"></script>
    <script src="frontend.js"></script>
    <script src="chat-widget.js"></script>
</body>
</html>
