    <section class="section auth-page">
        <h1 class="sr-only">تسجيل الدخول أو إنشاء حساب في Joo Optics</h1>
        <div class="card">
            <div class="auth-tabs">
                <button type="button" id="loginTab" class="auth-tab-btn active" onclick="setAuthMode(false)">تسجيل الدخول</button>
                <button type="button" id="registerTab" class="auth-tab-btn" onclick="setAuthMode(true)">إنشاء حساب</button>
            </div>

            <form id="authForm">
                <label class="lens-label" for="username">اسم المستخدم / البريد</label>
                <input class="lens-input account-full-input" type="text" id="username" name="username" required>

                <label class="lens-label" for="password">كلمة المرور</label>
                <input class="lens-input account-full-input" type="password" id="password" name="password" required>

                <div id="emailGroup" style="display: none;">
                    <label class="lens-label" for="email">البريد الإلكتروني</label>
                    <input class="lens-input account-full-input" type="email" id="email" name="email">

                    <label class="lens-label" for="dateOfBirth">تاريخ الميلاد</label>
                    <input class="lens-input account-full-input" type="date" id="dateOfBirth" name="dateOfBirth">
                </div>

                <button type="submit" class="button" id="submitButton" style="width: 100%;">تسجيل الدخول</button>
                <p class="auth-message" id="message"></p>
            </form>
        </div>
    </section>

    <script>
        // This page uses its own authApiCall (deliberately NOT named
        // apiCall, to avoid colliding with frontend.js's apiCall below -
        // that one returns null on failure and redirects to /login.html
        // on a 401, which would break this exact page). frontend.js is
        // still loaded for the shared header (cart count, avatar dropdown).
        const AUTH_API_BASE_URL = '/api';
        let isRegisterMode = false;

        // Professional-site touch: someone already logged in has no reason
        // to see the login form again.
        // Only skip the form when the saved token is genuinely still valid.
        // Access tokens last 15 minutes: an expired/garbage leftover token
        // used to bounce the visitor to the home page forever, with no way
        // to reach this form and log in again.
        function savedTokenIsValid() {
            try {
                const token = localStorage.getItem('authToken');
                if (!token) return false;
                const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
                return typeof payload.exp === 'number' && payload.exp * 1000 > Date.now() + 5000;
            } catch (e) {
                return false;
            }
        }

        if (savedTokenIsValid()) {
            window.location.href = '/index.html';
        } else {
            try {
                localStorage.removeItem('authToken');
                localStorage.removeItem('refreshToken');
            } catch (e) { /* storage blocked - nothing to clear */ }
        }

        // Turn the server's English error text into something a customer
        // can act on.
        function friendlyAuthError(message) {
            const m = String(message || '').toLowerCase();
            if (m.includes('invalid credentials')) return 'اسم المستخدم/الإيميل أو كلمة السر غلط';
            if (m.includes('too many')) return 'محاولات كتير - استنى دقيقة وجرّب تاني';
            if (m.includes('already exists')) return 'اسم المستخدم أو الإيميل مستخدم قبل كده';
            return message;
        }

        async function authApiCall(endpoint, method = 'GET', data = null) {
            const options = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                const response = await fetch(`${AUTH_API_BASE_URL}${endpoint}`, options);
                let responseData = {};
                try {
                    responseData = await response.json();
                } catch (e) {
                    responseData = {};
                }

                if (!response.ok) {
                    return { error: friendlyAuthError(responseData.message) || ('خطأ في الاتصال بالسيرفر (' + response.status + ')') };
                }

                return responseData.data || responseData;
            } catch (error) {
                return { error: error.message };
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const dateOfBirth = document.getElementById('dateOfBirth').value;

            if (!username || !email || !password || !dateOfBirth) {
                showMessage('من فضلك املأ كل الحقول', 'error');
                return;
            }

            const result = await authApiCall('/auth/register', 'POST', {
                username,
                email,
                password,
                date_of_birth: dateOfBirth,
            });

            if (result.error) {
                showMessage('فشل إنشاء الحساب: ' + result.error, 'error');
                return;
            }

            showMessage('تم إنشاء الحساب بنجاح! جارٍ تسجيل الدخول...', 'success');
            if (result.access_token) {
                localStorage.setItem('authToken', result.access_token);
                if (result.refresh_token) {
                    localStorage.setItem('refreshToken', result.refresh_token);
                }
            }
            setTimeout(() => {
                window.location.href = '/index.html';
            }, 1200);
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('من فضلك املأ كل الحقول', 'error');
                return;
            }

            const result = await authApiCall('/auth/login', 'POST', {
                username,
                password,
            });

            if (result.error) {
                showMessage('فشل تسجيل الدخول: ' + result.error, 'error');
                return;
            }

            if (result.access_token) {
                localStorage.setItem('authToken', result.access_token);
                if (result.refresh_token) {
                    localStorage.setItem('refreshToken', result.refresh_token);
                }
                showMessage('تم تسجيل الدخول بنجاح! جارٍ التحويل...', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1000);
            }
        }

        function setAuthMode(registerMode) {
            isRegisterMode = registerMode;
            const formTitleButton = document.getElementById('submitButton');
            const emailGroup = document.getElementById('emailGroup');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            loginTab.classList.toggle('active', !registerMode);
            registerTab.classList.toggle('active', registerMode);
            emailGroup.style.display = registerMode ? 'block' : 'none';
            formTitleButton.textContent = registerMode ? 'إنشاء حساب' : 'تسجيل الدخول';
            document.getElementById('message').textContent = '';
        }

        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'auth-message ' + (type === 'error' ? 'error-message' : 'success-message');
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isRegisterMode) {
                await register();
            } else {
                await login();
            }
        });
    </script>
